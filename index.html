<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Archive of Classics</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <div class="icon-btn">🏠</div>
    </div>
    <div class="nav-center">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="원서 제목이나 작가를 검색하세요...">
      </div>
    </div>
    <div class="nav-right">
      <div class="menu-text">Menu</div>
    </div>
  </nav>

  <main class="street-view">
    <div class="floor"></div>

    <div class="brick-wall">
      
      <!-- 갤러리 1 (빈 자리) -->
      <div class="gallery-slot empty"></div>

      <div class="lantern-wrapper"><div class="lantern-glow"></div><div class="lantern-body"></div></div>

      <!-- 갤러리 2 (빈 자리) -->
      <div class="gallery-slot empty"></div>

      <div class="lantern-wrapper"><div class="lantern-glow"></div><div class="lantern-body"></div></div>

      <!-- ★ 갤러리 3 (이상한 나라의 앨리스 - 와인색 문) -->
      <div class="gallery-slot active">
        <div class="door-frame">
          <div class="door-void">Enter the Gallery ➔</div>
          <a href="gallery.html" class="door-body">
            <div class="panel top-arch-panel"></div>
            <div class="door-title">Alice in Wonderland</div>
            <div class="panel-row">
              <div class="panel mid-panel"></div>
              <div class="panel mid-panel"></div>
            </div>
            <div class="panel-row">
              <div class="panel bot-panel"></div>
              <div class="panel bot-panel"></div>
            </div>
            <div class="door-knob"></div>
            <div class="door-knocker"></div>
          </a>
        </div>
      </div>

      <div class="lantern-wrapper"><div class="lantern-glow"></div><div class="lantern-body"></div></div>

      <!-- ★ 갤러리 4 (셜록 홈즈 - 네이비색 문 추가!) -->
      <div class="gallery-slot active">
        <div class="door-frame">
          <div class="door-void">Enter the Gallery ➔</div>
          <!-- gallery2.html 로 연결됩니다 -->
          <a href="gallery2.html" class="door-body" style="background: #1e293b;">
            <div class="panel top-arch-panel" style="background: #0f172a;"></div>
            <div class="door-title" style="color: #cbd5e1; font-size: 28px;">Sherlock Holmes</div>
            <div class="panel-row">
              <div class="panel mid-panel" style="background: #0f172a;"></div>
              <div class="panel mid-panel" style="background: #0f172a;"></div>
            </div>
            <div class="panel-row">
              <div class="panel bot-panel" style="background: #0f172a;"></div>
              <div class="panel bot-panel" style="background: #0f172a;"></div>
            </div>
            <div class="door-knob" style="background: #cbd5e1;"></div>
            <div class="door-knocker" style="border-color: #cbd5e1;"></div>
          </a>
        </div>
      </div>

      <div class="lantern-wrapper"><div class="lantern-glow"></div><div class="lantern-body"></div></div>

      <!-- 갤러리 5 (빈 자리) -->
      <div class="gallery-slot empty"></div>

    </div>
  </main>

</body>
</html>
