<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Chronicle</title>
  <style>
    :root {
      --bg-theme: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80');
      --card-parchment: #fcfbf9;
      --clover-empty: #e5e0d8;
      --clover-lvl-1: #d2dbbe; --clover-lvl-2: #a7ad8a; --clover-lvl-3: #6e7a5b; --clover-lvl-4: #4a523a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 100vw; height: 100vh; overflow: hidden; font-family: -apple-system, sans-serif; background-image: var(--bg-theme); background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; }

    .chronicle-container { width: 92vw; max-width: 1040px; height: 82vh; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 20px; }
    .calendar-card, .log-detail-card { background: var(--card-parchment); border-radius: 24px; box-shadow: 0 20px 45px rgba(0,0,0,0.3); padding: 32px; display: flex; flex-direction: column; }
    .cal-title, .journal-date { font-size: 24px; font-family: "Playfair Display", serif; color: #2b1f18; margin-bottom: 24px; }
    
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-gap: 12px 10px; align-items: center; justify-items: center; }
    .day-slot { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: 100%; }
    .clover-chip { width: 38px; height: 38px; border-radius: 13px; background: var(--clover-empty); transition: all 0.2s ease; box-shadow: inset 0 1px 2px rgba(255,255,255,0.4), 0 2px 5px rgba(0,0,0,0.06); }
    .day-slot:hover .clover-chip { transform: translateY(-3px) scale(1.05); }
    
    .lvl-1 { background: var(--clover-lvl-1); } .lvl-2 { background: var(--clover-lvl-2); } .lvl-3 { background: var(--clover-lvl-3); } .lvl-4 { background: var(--clover-lvl-4); }
    .day-number { font-size: 12px; color: #7c7267; }
    
    .timeline-stream { flex: 1; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 10px; }
    .stream-entry { background: white; border: 1px solid #e2dcd2; border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; }

    /* 하단 독 완벽 고정 */
    .bottom-dock {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(35, 25, 20, 0.78); backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 24px;
      display: flex; gap: 8px; padding: 8px 14px; box-shadow: 0 15px 35px rgba(0,0,0,0.35); z-index: 100;
    }
    .dock-btn {
      padding: 9px 16px; border-radius: 16px; color: #e5e5e5; text-decoration: none; font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 6px; border: none; background: transparent; cursor: pointer;
      transition: all 0.2s; font-family: -apple-system, sans-serif;
    }
    .dock-btn:hover, .dock-btn.active { background: rgba(255,255,255,0.18); color: #fff; }
  </style>
</head>
<body>

  <div class="chronicle-container">
    <div class="calendar-card">
      <h2 class="cal-title">September 2026</h2>
      <div class="days-grid" id="days-grid"></div>
    </div>
    <div class="log-detail-card">
      <h3 class="journal-date" id="selected-date-text">Select a date</h3>
      <div class="timeline-stream" id="timeline-stream"></div>
    </div>
  </div>

  <div class="bottom-dock">
    <a href="index_study.html" class="dock-btn">📌 Board</a>
    <a href="grass.html" class="dock-btn">🌿 Archives</a>
    <a href="history.html" class="dock-btn active">🗓️ Chronicle</a>
    <a href="word_room.html" class="dock-btn">🏛️ Voca Room</a>
  </div>

  <script>
    let currentDate = new Date();
    let selectedDateKey = currentDate.toISOString().split('T')[0];

    function renderCalendar() {
      const grid = document.getElementById('days-grid'); grid.innerHTML = '';
      const logs = JSON.parse(localStorage.getItem('study_tracker') || '{}');
      
      for (let day = 1; day <= 30; day++) {
        const dateKey = `2026-09-${String(day).padStart(2, '0')}`;
        const dayData = logs[dateKey] || { score: 0, logs: [] };
        const slot = document.createElement('div'); slot.className = 'day-slot';
        
        let lvl = 0;
        if (dayData.score >= 20) lvl = 4; else if (dayData.score >= 10) lvl = 3; else if (dayData.score >= 5) lvl = 2; else if (dayData.score > 0) lvl = 1;
        
        slot.innerHTML = `<div class="clover-chip ${lvl > 0 ? 'lvl-'+lvl : ''}"></div><span class="day-number">${day}</span>`;
        slot.onclick = () => renderJournalDetail(dateKey);
        grid.appendChild(slot);
      }
      renderJournalDetail(selectedDateKey);
    }

    function renderJournalDetail(dateKey) {
      document.getElementById('selected-date-text').innerText = dateKey;
      const logs = JSON.parse(localStorage.getItem('study_tracker') || '{}');
      const dayData = logs[dateKey] || { logs: [] };
      const stream = document.getElementById('timeline-stream'); stream.innerHTML = '';

      if (dayData.logs.length === 0) {
        stream.innerHTML = '<p style="color:#9e9488; text-align:center; margin-top:20px;">No archives logged on this date.</p>';
      } else {
        dayData.logs.forEach(item => {
          stream.innerHTML += `<div class="stream-entry"><div>${item}</div><span style="background:#efebe4; padding:3px 8px; border-radius:6px; font-weight:600; font-size:11px;">+5 pts</span></div>`;
        });
      }
    }

    window.onload = () => {
      const savedBg = localStorage.getItem('bg_theme');
      if (savedBg) document.documentElement.style.setProperty('--bg-theme', `url('${savedBg}')`);
      renderCalendar();
    };
  </script>
</body>
</html>
