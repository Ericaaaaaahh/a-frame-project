<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Lexicon Chamber</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    :root {
      --bg-theme: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80');
      --card-paper: #fcfbf9; --accent-wood: #5c3a21;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Playfair Display", serif; background-image: var(--bg-theme); background-size: cover; background-position: center; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 90px; }
    
    .container { width: 90vw; max-width: 860px; margin-top: 36px; }
    .card { background: var(--card-paper); border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.25); padding: 26px 30px; margin-bottom: 20px; }
    h2 { font-size: 20px; color: #2b1f18; margin-bottom: 14px; font-weight: 500; }
    .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
    input { width: 100%; padding: 11px 14px; border: 1px solid #e2dcd2; border-radius: 8px; font-family: -apple-system, sans-serif; }
    .btn-action { background: var(--accent-wood); color: white; border: none; padding: 11px 22px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: -apple-system, sans-serif; }

    #room-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; }
    #exit-btn { position: absolute; top: 20px; right: 20px; z-index: 1000; background: #8b3a3a; color: white; border: none; padding: 9px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: -apple-system, sans-serif; }
    
    #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 330px; background: white; padding: 24px; border-radius: 14px; box-shadow: 0 15px 35px rgba(0,0,0,0.35); z-index: 1001; }
    #m-word { font-size: 22px; color: var(--accent-wood); margin-bottom: 8px; font-family: "Playfair Display", serif;}
    #modal p { font-size: 13px; margin: 6px 0; font-family: -apple-system, sans-serif; }
    .m-btns { display: flex; gap: 8px; margin-top: 16px; }
    .m-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: -apple-system, sans-serif; font-size: 12px; }

    /* 하단 독 완벽 고정 */
    .bottom-dock {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(35, 25, 20, 0.78); backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 24px;
      display: flex; gap: 8px; padding: 8px 14px; box-shadow: 0 15px 35px rgba(0,0,0,0.35); z-index: 100;
    }
    .dock-btn {
      padding: 9px 16px; border-radius: 16px; color: #e5e5e5; text-decoration: none; font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 6px; border: none; background: transparent; cursor: pointer;
      transition: all 0.2s; font-family: -apple-system, sans-serif;
    }
    .dock-btn:hover, .dock-btn.active { background: rgba(255,255,255,0.18); color: #fff; }
  </style>
</head>
<body>

  <div class="container" id="hub-view">
    <div class="card">
      <h2>➕ Lexicon Repository</h2>
      <div class="input-row">
        <input type="text" id="w-word" placeholder="Word (e.g. ubiquitous)">
        <input type="text" id="w-meaning" placeholder="Definition (뜻)">
      </div>
      <button class="btn-action" onclick="saveWord()">Deposit to Archive</button>
    </div>
    <div class="card" style="text-align: center;">
      <h2>🏛️ 3D Memory Palace Chamber</h2>
      <button class="btn-action" style="margin-top:10px; background:#4a523a;" onclick="startRoom()">Enter Chamber</button>
    </div>
  </div>

  <div class="bottom-dock">
    <a href="index_study.html" class="dock-btn">📌 Board</a>
    <a href="grass.html" class="dock-btn">🌿 Archives</a>
    <a href="history.html" class="dock-btn">🗓️ Chronicle</a>
    <a href="word_room.html" class="dock-btn active">🏛️ Voca Room</a>
  </div>

  <div id="room-view">
    <button id="exit-btn" onclick="closeRoom()">Leave Chamber</button>
    <div id="modal">
      <h3 id="m-word">Word</h3>
      <p><strong>Definition:</strong> <span id="m-mean"></span></p>
      <div class="m-btns">
        <button class="m-btn" style="background:#fee2e2; color:#991b1b;" onclick="closeModal()">Review Later</button>
        <button class="m-btn" style="background:#dcfce7; color:#166534;" onclick="closeModal()">Retained</button>
      </div>
    </div>

    <a-scene embedded style="width: 100%; height: 100%;">
      <a-camera position="0 1.6 0"><a-cursor color="#4a523a"></a-cursor></a-camera>
      <a-plane position="0 0 0" rotation="-90 0 0" width="14" height="14" color="#f2eee9"></a-plane>
      <a-plane position="0 2.5 -7" width="14" height="5" color="#faf8f5"></a-plane>
      <a-plane position="0 2.5 7" rotation="0 180 0" width="14" height="5" color="#faf8f5"></a-plane>
      <a-plane position="-7 2.5 0" rotation="0 90 0" width="14" height="5" color="#faf8f5"></a-plane>
      <a-plane position="7 2.5 0" rotation="0 -90 0" width="14" height="5" color="#faf8f5"></a-plane>
      <a-entity id="word-holder"></a-entity>
    </a-scene>
  </div>

  <script>
    function saveWord() {
      const w = document.getElementById('w-word').value.trim();
      const m = document.getElementById('w-meaning').value.trim();
      if (!w || !m) return;
      const db = JSON.parse(localStorage.getItem('voca_db') || '[]');
      db.push({ word: w, meaning: m });
      localStorage.setItem('voca_db', JSON.stringify(db));
      document.getElementById('w-word').value = ''; document.getElementById('w-meaning').value = '';
    }

    function startRoom() {
      const db = JSON.parse(localStorage.getItem('voca_db') || '[{"word":"mitochondria","meaning":"미토콘드리아"}]');
      document.getElementById('room-view').style.display = 'block';
      const holder = document.getElementById('word-holder'); holder.innerHTML = '';

      const walls = [{ z: -6.9, rot: "0 0 0", axis: 'x' }, { z: 6.9, rot: "0 180 0", axis: 'x' }, { x: -6.9, rot: "0 90 0", axis: 'z' }, { x: 6.9, rot: "0 -90 0", axis: 'z' }];
      
      db.slice(0, 16).forEach((item, i) => {
        const w = walls[i % 4];
        const offset = ((i % 4) - 1.5) * 2.8;
        const el = document.createElement('a-text');
        el.setAttribute('value', item.word); el.setAttribute('align', 'center'); el.setAttribute('color', '#2b1f18');
        el.setAttribute('width', 7); el.setAttribute('rotation', w.rot);
        el.setAttribute('position', `${w.axis === 'x' ? offset : w.x} 2.5 ${w.axis === 'z' ? offset : w.z}`);
        el.setAttribute('class', 'clickable');
        el.addEventListener('click', () => {
          document.getElementById('m-word').innerText = item.word;
          document.getElementById('m-mean').innerText = item.meaning;
          document.getElementById('modal').style.display = 'block';
        });
        holder.appendChild(el);
      });
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function closeRoom() { document.getElementById('room-view').style.display = 'none'; closeModal(); }
    window.onload = () => { const savedBg = localStorage.getItem('bg_theme'); if (savedBg) document.documentElement.style.setProperty('--bg-theme', `url('${savedBg}')`); };
  </script>
</body>
</html>
