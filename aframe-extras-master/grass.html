<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject Matrix Archive</title>
  <style>
    :root {
      --bg-theme: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80');
      --folder-paper: #fbf9f5;
      --folder-tab: #e7e0d5;
      --text-dark: #2b1f18;
      --border-color: #d6ccbe;
      /* 올리브 아카데미아 팔레트 */
      --g-lvl-0: #ece8e1; --g-lvl-1: #d2dbbe; --g-lvl-2: #a7ad8a; --g-lvl-3: #6e7a5b; --g-lvl-4: #4a523a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Playfair Display", "Times New Roman", serif;
      background-image: var(--bg-theme); background-size: cover; background-position: center;
      display: flex; justify-content: center; align-items: center;
    }

    .archive-workspace { width: 90vw; max-width: 1000px; height: 80vh; max-height: 700px; display: flex; flex-direction: column; }
    .folder-tabs-bar { display: flex; gap: 4px; padding-left: 16px; position: relative; bottom: -1px; z-index: 5; overflow-x: auto; }
    .folder-tab {
      background: var(--folder-tab); border: 1px solid var(--border-color); border-bottom: none;
      padding: 10px 22px; border-radius: 12px 12px 0 0; font-size: 13px; font-weight: 600; color: #7c7267;
      cursor: pointer; transition: all 0.2s ease; font-family: -apple-system, sans-serif;
    }
    .folder-tab.active { background: var(--folder-paper); color: var(--text-dark); padding-top: 12px; border-top: 3px solid #6e7a5b; z-index: 10; }

    .folder-body {
      flex: 1; background: var(--folder-paper); border: 1px solid var(--border-color); border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3); padding: 28px 36px; display: flex; flex-direction: column; z-index: 6; overflow-y: auto;
    }
    .body-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 20px; }
    .subject-title { font-size: 26px; color: var(--text-dark); font-weight: 500; }

    .matrix-container { background: rgba(255,255,255,0.7); border: 1px solid #ebdcd0; border-radius: 12px; padding: 22px; margin-bottom: 24px; }
    .matrix-grid { display: grid; grid-template-rows: repeat(7, 14px); grid-auto-flow: column; grid-auto-columns: 14px; gap: 5px; overflow-x: auto; padding-bottom: 8px; }
    .cube { width: 14px; height: 14px; border-radius: 3px; background: var(--g-lvl-0); transition: transform 0.1s; }
    .cube:hover { transform: scale(1.3); }
    .lvl-1 { background-color: var(--g-lvl-1); } .lvl-2 { background-color: var(--g-lvl-2); } .lvl-3 { background-color: var(--g-lvl-3); } .lvl-4 { background-color: var(--g-lvl-4); }

    .input-bar { display: flex; gap: 10px; margin-bottom: 16px; }
    .input-bar input { flex: 1; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; font-family: -apple-system, sans-serif; }
    .input-bar button { background: #4a523a; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    
    .log-tray { flex: 1; overflow-y: auto; margin-top: 10px; }
    .log-entry { display: flex; justify-content: space-between; padding: 10px 4px; border-bottom: 1px dashed var(--border-color); font-size: 13px; font-family: -apple-system, sans-serif; }

    /* 하단 독 완벽 고정 */
    .bottom-dock {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(35, 25, 20, 0.78); backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 24px;
      display: flex; gap: 8px; padding: 8px 14px; box-shadow: 0 15px 35px rgba(0,0,0,0.35); z-index: 100;
    }
    .dock-btn {
      padding: 9px 16px; border-radius: 16px; color: #e5e5e5; text-decoration: none; font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 6px; border: none; background: transparent; cursor: pointer;
      transition: all 0.2s; font-family: -apple-system, sans-serif;
    }
    .dock-btn:hover, .dock-btn.active { background: rgba(255,255,255,0.18); color: #fff; }
  </style>
</head>
<body>

  <div class="archive-workspace">
    <div class="folder-tabs-bar" id="tab-bar"></div>
    <div class="folder-body">
      <div class="body-header">
        <h1 class="subject-title" id="display-subject">AP Biology</h1>
      </div>
      <div class="matrix-container">
        <div class="matrix-grid" id="matrix-grid"></div>
      </div>
      <div class="input-bar">
        <input type="text" id="entry-input" placeholder="Record achievement (e.g. AP BIO 15p)...">
        <button onclick="handleLogSubmit()">Log Record</button>
      </div>
      <div class="log-tray" id="log-tray"></div>
    </div>
  </div>

  <div class="bottom-dock">
    <a href="index_study.html" class="dock-btn">📌 Board</a>
    <a href="grass.html" class="dock-btn active">🌿 Archives</a>
    <a href="history.html" class="dock-btn">🗓️ Chronicle</a>
    <a href="word_room.html" class="dock-btn">🏛️ Voca Room</a>
  </div>

  <script>
    const todayStr = new Date().toISOString().split('T')[0];
    const DEFAULT_SUBJECTS = ["AP Biology", "World History", "Literature", "Vocabulary"];
    let currentSubject = DEFAULT_SUBJECTS[0];

    function getStore() { return JSON.parse(localStorage.getItem('subject_grass_store') || '{}'); }
    function saveStore(store) { localStorage.setItem('subject_grass_store', JSON.stringify(store)); renderCurrentView(); }

    function renderTabs() {
      const bar = document.getElementById('tab-bar'); bar.innerHTML = '';
      DEFAULT_SUBJECTS.forEach(sub => {
        const tab = document.createElement('div');
        tab.className = `folder-tab ${sub === currentSubject ? 'active' : ''}`;
        tab.innerText = sub;
        tab.onclick = () => { currentSubject = sub; renderTabs(); renderCurrentView(); };
        bar.appendChild(tab);
      });
    }

    function handleLogSubmit() {
      const input = document.getElementById('entry-input');
      const text = input.value.trim();
      if (!text) return;
      
      const store = getStore();
      if (!store[currentSubject]) store[currentSubject] = {};
      if (!store[currentSubject][todayStr]) store[currentSubject][todayStr] = { score: 0, logs: [] };
      
      store[currentSubject][todayStr].score += 5;
      store[currentSubject][todayStr].logs.push(text);
      saveStore(store);
      
      const totalTracker = JSON.parse(localStorage.getItem('study_tracker') || '{}');
      if (!totalTracker[todayStr]) totalTracker[todayStr] = { score: 0, logs: [] };
      totalTracker[todayStr].score += 5;
      totalTracker[todayStr].logs.push(`[${currentSubject}] ${text}`);
      localStorage.setItem('study_tracker', JSON.stringify(totalTracker));
      
      input.value = '';
    }

    function renderCurrentView() {
      document.getElementById('display-subject').innerText = currentSubject;
      const store = getStore();
      const subjectData = store[currentSubject] || {};
      const grid = document.getElementById('matrix-grid'); grid.innerHTML = '';
      
      for (let i = 125; i >= 0; i--) {
        const d = new Date(); d.setDate(new Date().getDate() - i);
        const k = d.toISOString().split('T')[0];
        const day = subjectData[k] || { score: 0 };
        const cube = document.createElement('div');
        cube.className = 'cube';
        let lvl = 0;
        if (day.score >= 20) lvl = 4; else if (day.score >= 10) lvl = 3; else if (day.score >= 5) lvl = 2; else if (day.score > 0) lvl = 1;
        if (lvl > 0) cube.classList.add(`lvl-${lvl}`);
        grid.appendChild(cube);
      }

      const tray = document.getElementById('log-tray'); tray.innerHTML = '';
      const todayEntries = subjectData[todayStr]?.logs || [];
      todayEntries.forEach(item => {
        tray.innerHTML += `<div class="log-entry"><span>${item}</span><span style="background:#ece8e1; padding:3px 8px; border-radius:4px; font-weight:bold;">+5 units</span></div>`;
      });
    }

    window.onload = () => { 
      const savedBg = localStorage.getItem('bg_theme');
      if (savedBg) document.documentElement.style.setProperty('--bg-theme', `url('${savedBg}')`);
      renderTabs(); renderCurrentView(); 
    };
  </script>
</body>
</html>
