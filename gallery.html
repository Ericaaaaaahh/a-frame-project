<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Monochrome Linear Gallery</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    #ui-container {
      position: absolute; top: 20px; left: 20px; z-index: 1000;
      background: rgba(15, 15, 15, 0.9); padding: 18px;
      border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      width: 320px; font-family: 'Georgia', serif; border: 1px solid rgba(255,255,255,0.1);
      color: #e5e5e5; backdrop-filter: blur(5px);
    }
    textarea { 
      width: 100%; height: 110px; margin-bottom: 12px; padding: 10px; 
      box-sizing: border-box; border: 1px solid rgba(255,255,255,0.2); 
      border-radius: 4px; line-height: 1.5; background: #222; color: #fff;
      font-family: inherit; font-size: 13px; outline: none;
    }
    button { 
      width: 100%; padding: 12px; background: #fff; color: #000; 
      border: none; border-radius: 4px; font-weight: bold; font-size: 13px; 
      cursor: pointer; transition: 0.2s; letter-spacing: 1px; margin-bottom: 8px;
    }
    button:hover { background: #ccc; }
    
    #shiftBtn {
      position: absolute; bottom: 30px; right: 30px; z-index: 1000;
      width: 80px; height: 80px; background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
      color: white; font-size: 14px; font-weight: bold; cursor: pointer;
      backdrop-filter: blur(4px); transition: 0.2s;
    }
    #shiftBtn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.95); }
    .back-btn { display: inline-block; margin-bottom: 12px; color: #aaa; text-decoration: none; font-size: 12px; }
  </style>

  <script>
    AFRAME.registerComponent('wall-collider', {
      init: function () { this.playerRadius = 0.5; },
      tick: function () {
        const playerPos = this.el.object3D.position;
        const walls = document.querySelectorAll('.solid-wall');
        
        walls.forEach(wall => {
          if (wall.parentElement.dataset.lifted === "true") return;

          const mesh = wall.getObject3D('mesh');
          if (!mesh) return;

          const box = new THREE.Box3().setFromObject(mesh);
          const closestPoint = new THREE.Vector3();
          box.clampPoint(playerPos, closestPoint);
          closestPoint.y = playerPos.y; 

          const dist = Math.hypot(playerPos.x - closestPoint.x, playerPos.z - closestPoint.z);
          
          if (dist < this.playerRadius) {
            const overlap = this.playerRadius - dist;
            const pushDir = new THREE.Vector3(playerPos.x - closestPoint.x, 0, playerPos.z - closestPoint.z);
            if (pushDir.lengthSq() === 0) pushDir.set(0, 0, 1);
            else pushDir.normalize();
            
            playerPos.add(pushDir.multiplyScalar(overlap));
          }
        });
      }
    });
  </script>
</head>
<body>

  <div id="ui-container">
    <a href="index.html" class="back-btn">← 메인 서재로 돌아가기</a>
    <h3 style="margin: 0 0 10px 0; letter-spacing: 2px;">THE LINEAR ARCHIVE</h3>
    <textarea id="textInput">Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do. Once or twice she had peeped into the book her sister was reading, but it had no pictures or conversations in it. "And what is the use of a book," thought Alice, "without pictures or conversations?" So she was considering in her own mind whether the pleasure of making a daisy-chain would be worth the trouble of getting up and picking the daisies. When suddenly a White Rabbit with pink eyes ran close by her!</textarea>
    <button id="generateBtn">직선 갤러리 렌더링</button>
  </div>

  <button id="shiftBtn">SHIFT<br>(Lift)</button>

  <a-scene>
    <!-- 까만 하늘과 진회색 바닥 -->
    <a-sky color="#050505"></a-sky>
    <a-plane position="0 0 -50" rotation="-90 0 0" width="12" height="300" color="#1a1a1a" material="roughness: 0.9"></a-plane>

    <!-- 밝고 선명한 전체 조명 -->
    <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>

    <a-entity id="gallery-container"></a-entity>

    <a-entity id="player" position="0 0 4" wall-collider>
      <a-camera position="0 1.6 0" look-controls wasd-controls="acceleration: 45">
        <a-cursor color="#ffffff" scale="0.8 0.8 0.8"></a-cursor>
      </a-camera>
    </a-entity>
  </a-scene>

  <script>
    function buildLinearGallery() {
      const text = document.getElementById('textInput').value;
      const chunks = text.match(/[^.!?]+[.!?]+/g) || [text];
      const container = document.getElementById('gallery-container');
      container.innerHTML = '';

      const spacing = 5;

      chunks.forEach((chunk, i) => {
        const z = - (i * spacing);

        const wallGroup = document.createElement('a-entity');
        // ★ 벽이 바닥에 묻히지 않는 정확한 Y 좌표(1.75)
        wallGroup.setAttribute('position', `0 1.75 ${z}`);
        wallGroup.setAttribute('class', 'door-wall-group');
        wallGroup.dataset.lifted = "false";

        const wall = document.createElement('a-box');
        wall.setAttribute('width', '6.0');
        wall.setAttribute('height', '3.5');
        wall.setAttribute('depth', '0.2');
        wall.setAttribute('color', '#ffffff');
        wall.setAttribute('material', 'roughness: 0.95');
        wall.setAttribute('class', 'solid-wall');

        const textEl = document.createElement('a-text');
        textEl.setAttribute('value', chunk.trim());
        textEl.setAttribute('align', 'center');
        textEl.setAttribute('width', '5.2');
        textEl.setAttribute('wrap-count', '35');
        textEl.setAttribute('position', `0 0 0.12`);
        // ★ 완전한 검정 텍스트
        textEl.setAttribute('color', '#000000'); 

        // ★ 자연스럽고 은은한 웜톤 갤러리 핀 조명
        const light = document.createElement('a-light');
        light.setAttribute('type', 'point');
        light.setAttribute('color', '#fff5e6');
        light.setAttribute('intensity', '0.8');
        light.setAttribute('distance', '7');
        light.setAttribute('position', '0 1 2');

        wallGroup.appendChild(wall);
        wallGroup.appendChild(textEl);
        wallGroup.appendChild(light);
        container.appendChild(wallGroup);
      });
    }

    function liftClosestWall() {
      const playerPos = document.getElementById('player').object3D.position;
      const walls = document.querySelectorAll('.door-wall-group');
      
      let closestWall = null;
      let minDist = Infinity;

      walls.forEach(group => {
        if (group.dataset.lifted === "true") return; 
        
        const wallZ = group.object3D.position.z;
        const distZ = playerPos.z - wallZ; 
        
        // ★ 벽에서 8미터 떨어져 있어도 열리도록 넉넉한 범위 설정
        if (distZ > -1.0 && distZ < 8.0) {
          if (Math.abs(distZ) < minDist) {
            minDist = Math.abs(distZ);
            closestWall = group;
          }
        }
      });

      if (closestWall) {
        closestWall.dataset.lifted = "true"; 
        const currentZ = closestWall.getAttribute('position').z;
        closestWall.setAttribute('animation', `property: position; to: 0 6 ${currentZ}; dur: 1500; easing: easeInOutCubic`);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Shift') liftClosestWall();
    });
    document.getElementById('shiftBtn').addEventListener('click', liftClosestWall);

    document.getElementById('generateBtn').addEventListener('click', buildLinearGallery);
    window.addEventListener('load', buildLinearGallery);
  </script>
</body>
</html>
